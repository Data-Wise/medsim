url: https://data-wise.github.io/medsim/

template:
  bootstrap: 5
  bootswatch: litera
  bslib:
    # Consistent academic blue across ecosystem
    primary: "#0054AD"
    bg: "#ffffff"
    fg: "#212529"
    # Modern, readable fonts (consistent with medfit/probmed)
    base_font: { google: "Inter" }
    heading_font: { google: "Montserrat" }
    code_font: { google: "Fira Code" }
    font-size-base: 0.925rem

  opengraph:
    image:
      src: man/figures/logo.png
      alt: "medsim: Simulation Infrastructure for Mediation Analysis"
    twitter:
      creator: "@dtofighi"
      card: summary_large_image

home:
  title: "medsim: Simulation Infrastructure for Mediation Analysis"
  description: >
    Standardized infrastructure for conducting Monte Carlo simulation studies
    in mediation analysis. Features environment-aware execution, parallel
    processing, and publication-ready visualization.

  sidebar:
    structure: [links, license, citation, authors, dev]

  links:
  - text: "Source Code"
    href: https://github.com/data-wise/medsim
  - text: "Report Issues"
    href: https://github.com/data-wise/medsim/issues
  - text: "Request Feature"
    href: https://github.com/data-wise/medsim/issues/new

logo:
  image: man/figures/logo.png
  align: right
  width: 350px

navbar:
  structure:
    left:  [home, reference, articles, ecosystem, news]
    right: [search, github]
  components:
    home:
      icon: fas fa-home fa-lg
      href: index.html
      aria-label: Home
    reference:
      text: Reference
      href: reference/index.html
    articles:
      text: Vignettes
      menu:
      - text: "Getting Started"
        href: articles/getting-started.html
      - text: "Cluster Testing (two-tier model)"
        href: articles/cluster-testing.html
    ecosystem:
      text: Ecosystem
      href: https://data-wise.github.io/mediationverse/articles/ecosystem.html
    news:
      text: News
      href: news/index.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/data-wise/medsim
      aria-label: GitHub

reference:
- title: End-to-End Workflow
  desc: >
    Convenience wrappers that produce all standard outputs (analysis,
    figures, tables) from simulation results in one call.
  contents:
  - medsim_workflow
  - medsim_figures
  - medsim_tables

- title: Configuration & Environment
  desc: >
    Functions for configuring simulation execution and detecting the runtime
    environment (local vs HPC cluster).
  contents:
  - medsim_config
  - medsim_detect_environment
  - medsim_detect_cores
  - medsim_get_optimal_cores
  - medsim_estimate_speedup
  - medsim_compare_configs

- title: Simulation Scenarios
  desc: >
    Functions for defining and validating simulation scenarios with ground
    truth parameters, and the estimand-kind descriptor used by downstream
    analysis commands.
  contents:
  - medsim_estimand
  - medsim_scenario
  - medsim_scenarios_mediation
  - medsim_validate_scenario

- title: Numeric Accuracy Scenarios
  desc: >
    Scenario factory for numerical accuracy and timing studies (e.g., the
    product-of-three CI comparison).  Uses `estimand$kind = "numeric"` —
    no DGM, no coverage/power analysis; only `error`, `abs_error`,
    `elapsed_sec` result columns and timing tables.
  contents:
  - medsim_scenario_numeric

- title: P_med Probabilistic Mediation (pmed)
  desc: >
    Scenario factory and MBCO estimator adapter for the P_med probabilistic
    estimand `P(Y1 > Y0) + 0.5·P(Y1 == Y0)`.  Uses `estimand$kind = "probabilistic"`
    so `medsim_analyze_coverage()` dispatches the MBCO-CI coverage branch.
    Ground truth is computed via a cross-world potential-outcome draw at
    scenario construction time.
  contents:
  - medsim_scenario_pmed
  - medsim_method_pmed_mbco

- title: Differential-Misclassification Bounds (DM)
  desc: >
    Scenario factory and estimator adapter for partial-identification bounds
    studies (me-mediator-bounds / me-exposure-recall).  Uses the
    `interval`-kind estimand so that `medsim_analyze_coverage()` dispatches
    the Imbens-Manski / partial-ID coverage branch automatically.
    Requires **medrobust** (Suggests); synthetic fallback used when absent.
  contents:
  - medsim_scenario_dm
  - medsim_method_bounds

- title: Sobol / Functional-ANOVA Variance Share
  desc: >
    Scenario factory and estimator adapter for the Sobol variance-share
    proportion mediated (P_med^sigma2 = V_med/V_T).  Uses the
    `variance_share`-kind estimand with a closed-form ground truth; the
    estimator is injected, not vendored.
  contents:
  - medsim_scenario_sobol
  - medsim_method_sobol

- title: Running Simulations
  desc: >
    Core functions for executing Monte Carlo simulations with progress
    tracking and parallel processing.
  contents:
  - medsim_run
  - medsim_run_parallel

- title: Hopper / SLURM Cluster Harness
  desc: >
    Three-piece pattern for chunked SLURM array jobs on UNM CARC Hopper.
    Write a submit script, run one chunk per array task, then combine the
    resulting RDS files into a single `medsim_results` object for analysis.
  contents:
  - medsim_write_submit_script
  - medsim_run_chunk
  - medsim_combine_chunks

- title: Result Analysis
  desc: >
    Functions for analyzing simulation results including coverage, power,
    and method comparisons.
  contents:
  - medsim_analyze
  - medsim_analyze_coverage
  - medsim_analyze_power
  - medsim_compare_methods
  - medsim_check_results

- title: ADEMP / Performance Reporting
  desc: >
    Functions for ADEMP-compliant performance reporting: sizing replications
    to a target coverage Monte Carlo SE, SE-vs-estimate diagnostics, and
    full performance summaries (bias, empirical SE, model SE, RMSE + MCSEs).
    Coverage output from `medsim_analyze_coverage()` also gains `coverage_mcse`,
    `n_failed`, and `failure_rate` columns in v0.4.0.
  contents:
  - medsim_nsim_for_mcse
  - medsim_plot_se_vs_estimate
  - medsim_analyze_performance
  - medsim_table_performance

- title: Missing-Data & Nonnormality (DGM)
  desc: >
    Data-generating utilities and missing-data mediation estimator adapters for
    simulations under missingness and nonnormality (the Missing Effect study).
  contents:
  - medsim_rnonnormal
  - medsim_amputate
  - medsim_scenario_missing
  - medsim_scenario_missing_grid
  - medsim_method_mbco_mi
  - medsim_method_mc_ci
  - medsim_method_ipw
  - medsim_summarize_branch_switch

- title: Caching
  desc: >
    Functions for caching ground truth values and simulation results to
    avoid redundant computation.
  contents:
  - medsim_cache_init
  - medsim_cache_save
  - medsim_cache_load
  - medsim_cache_exists
  - medsim_cache_list
  - medsim_cache_info
  - medsim_cache_clear

- title: Visualization
  desc: >
    Functions for creating publication-ready figures from simulation results.
  contents:
  - medsim_plot_coverage
  - medsim_plot_error_boxplot
  - medsim_plot_timing
  - medsim_plot_combined_panel

- title: LaTeX Tables
  desc: >
    Functions for generating publication-ready LaTeX tables from simulation
    results.
  contents:
  - medsim_table_accuracy
  - medsim_table_comparison
  - medsim_table_coverage
  - medsim_table_power
  - medsim_table_timing
  - medsim_tables_workflow
  - medsim_write_table

- title: Print & Summary Methods
  desc: >
    S3 methods for printing and summarizing medsim objects.
  contents:
  - starts_with("print.")
  - starts_with("summary.")

