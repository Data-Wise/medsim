# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# R-devel runs separately on a weekly schedule (R-CMD-check-devel.yaml)
# because it has no PPM binaries and source compilation takes ~30 min.
# Keeping it off PRs makes the feedback loop ~4 min instead of ~30 min.
on:
  workflow_dispatch:

name: PR 67 dependency-only check

permissions: read-all

concurrency:
  group: R-CMD-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4
        with:
          ref: 09f1c615f700581cb7bb9ea20b79a2f4b0b023fe
          persist-credentials: false

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # CRAN medfit 0.3.2 cannot load with S7 1.0.0.
          extra-packages: any::rcmdcheck, any::quarto, RConsortium/S7@v0.2.2
          needs: check
          install-quarto: true

      - name: Verify the tested head and load dependencies
        shell: Rscript {0}
        run: |
          sha <- system2("git", c("rev-parse", "HEAD"), stdout = TRUE)
          stopifnot(identical(sha, "09f1c615f700581cb7bb9ea20b79a2f4b0b023fe"))
          cat("Tested PR #67 head", sha, "\n")
          for (package in c("S7", "medfit", "probmed")) {
            loadNamespace(package)
            cat(package, as.character(packageVersion(package)), "\n")
          }
          stopifnot(packageVersion("S7") == "0.2.2")
