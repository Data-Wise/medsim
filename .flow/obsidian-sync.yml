# Obsidian vault destination for savant /savant:session + /savant:report delivery.
# The session-report skill (reference/report-delivery.md §3b, order 3) reads `vault_root`
# and resolves it to (vault_id, subfolder): here vault_id="Documents",
# subfolder="Engineering/50_packages/medsim".
#
# CORRECTED 2026-08-22: this previously pointed at Research/20_projects/medsim. medsim is
# software engineering, not a research project -- its hub note has always lived at
# Engineering/50_packages/medsim.md alongside probmed.md and medfit.md. Two session reports
# were moved out of Research/20_projects/medsim/ (now removed) into the folder below.
# NOTE: Engineering/ has its own .obsidian/ and is opened as a separate vault in the app, but
# obs registers only the outer `Documents` vault and indexes Engineering as a subfolder of it
# -- so vault_id stays "Documents"; nested vaults are deduped and cannot be registered.
#
# `pairs` are used only by the vault->repo `/obs:sync` mirror (vault is canonical). medsim has
# no vault-authored notes to mirror back, so they stay commented out — do not add a pair that
# points at a nonexistent vault dir (it would report phantom drift / clobber repo report files).
vault_root: "/Users/dt/Library/Mobile Documents/iCloud~md~obsidian/Documents/Engineering/50_packages/medsim"
pairs:
  # - { vault: "teaching", repo: "teaching" }
include: ["*.md"]
exclude: ["_archive"]
